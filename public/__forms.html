<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dino’s Lab forms</title>
  </head>
  <body>
    <!-- Detection skeletons for Netlify Forms. Field names must match the live forms. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="interest" />
      <input name="bot-field" />
      <input name="product" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <select name="quantity">
        <option value="just-trying">Just trying it / not sure</option>
        <option value="1-5">1–5</option>
        <option value="6-20">6–20</option>
        <option value="21-100">21–100</option>
        <option value="100+">100+</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
