<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dino's Lab OG</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: oklch(0.15 0.025 180);
        color: oklch(0.96 0.05 180);
        font-family: "Inter Variable", "Liberation Sans", sans-serif;
      }

      .bar {
        height: 3px;
        background: oklch(0.76 0.1 180);
      }

      .card {
        display: flex;
        align-items: center;
        gap: 40px;
        box-sizing: border-box;
        height: 627px;
        padding: 0 96px;
      }

      .logo {
        width: 420px;
        height: 420px;
        flex-shrink: 0;
      }

      p {
        margin: 0;
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: oklch(0.76 0.05 180);
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="card">
      <img class="logo" src="../public/logo.svg" alt="" />
      <p>DNL-N6 · STM32N6 SoM</p>
    </div>
  </body>
</html>
